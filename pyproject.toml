[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"  # ← this is the fix

[project]
name = "trending-repos"
version = "0.1.0"
description = "A CLI tool to browse trending GitHub repositories by time range"
requires-python = ">=3.9"

dependencies = [
    "requests>=2.32.0",
]

[project.scripts]
trending-repos = "trending_repos.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trending_repos*"]